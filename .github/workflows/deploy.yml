name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cấu hình Firebase/Cloudinary lấy từ GitHub Variable APP_ENV (nội dung giống file .env)
      - name: Tạo .env
        run: |
          if [ -z "$APP_ENV" ]; then echo "::error::Chưa khai báo Variable APP_ENV (Settings → Secrets and variables → Actions → Variables)"; exit 1; fi
          printf '%s\n' "$APP_ENV" > .env
        env:
          APP_ENV: ${{ vars.APP_ENV }}
      - name: Build
        run: npm run build
        env:
          # Site sẽ chạy tại https://<user>.github.io/<tên-repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
